.mut{color:var(--mut)}

main{padding:0 14px 20px}

.row{display:flex;align-items:center;gap:10px}

.howbox{background:var(--panel2);border-radius:11px;padding:10px 12px;margin-bottom:4px}

.set .go{margin-left:auto;height:40px;padding:0 16px;border-radius:11px;background:var(--acc);color:#14181C;font-weight:700;font-size:14px}

nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--panel);border-top:1px solid var(--line)}

nav button .i{width:20px;height:20px}
nav button.on{color:var(--acc)}

function L(a,b,w){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="currentColor" stroke-width="${w||3}" stroke-linecap="round"/>`}

  s+=`<circle cx="${p.head[0]}" cy="${p.head[1]}" r="7" fill="none" stroke="currentColor" stroke-width="3"/>`;
  s+=L(p.sho,p.hip,3.5)+L(p.sho,p.elb)+L(p.elb,p.hand)+L(p.hip,p.knee)+L(p.knee,p.ank);

    s+=`<path d="M${p.ank[0]-3} ${p.ank[1]+2} q-4 6 2 10" fill="none" stroke="var(--acc,#FFB81C)" stroke-width="2"/>`; }

function plan(it){
  const h=hist(it.ex);
  if(!h.length) return {w:it.init,r:it.repMin,why:'初回',cls:''};
  const last=h[h.length-1], lo=Math.min(...last.reps);
  if(isBody(it.type)) return {w:0,r:lo+1,why:lo>=it.repMax?'上限到達 → 回数を伸ばす':'回数+1',cls:lo>=it.repMax?'up':'rep'};
  if(lo>=it.repMax) return {w:last.weight+it.step,r:it.repMin,why:'全セット達成 → 増量',cls:'up'};
  let stall=0;
  for(let i=h.length-1;i>0;i--){
    if(h[i].weight!==last.weight||h[i-1].weight!==last.weight) break;
    if(Math.min(...h[i].reps)<=Math.min(...h[i-1].reps)) stall++; else break;
  }
  if(stall>=2) return {w:Math.max(it.step,rnd(last.weight*.9,it.step)),r:it.repMin,why:'停滞2回 → 10%減量',cls:'dn'};
  return {w:last.weight,r:Math.min(it.repMax,lo+1),why:'同重量・回数+1',cls:'rep'};
}

}

  const id='i'+(++df.seq), it=mkItem(id,ex), p=plan(it);
  df.list.push({id,ex,part});
  df.e[id]={ex,w:p.w,tmp:Array(it.sets).fill(p.r),reps:Array(it.sets).fill(null)};
  return id;
}
function ensure(df){
  df.list.forEach(r=>{ const it=mkItem(r.id,r.ex), p=plan(it), e=df.e[r.id];
    if(!e||e.ex!==r.ex){ df.e[r.id]={ex:r.ex,w:p.w,tmp:Array(it.sets).fill(p.r),reps:Array(it.sets).fill(null)}; return; }
    while(e.tmp.length<it.sets){ e.tmp.push(p.r); e.reps.push(null); } });
  save(); return df;
}
function curDraft(){
  const k=ymd(new Date());
  if(!(S.draft&&S.draft.date===k&&S.draft.list)) S.draft=newDraft(k,S.place);
  return ensure(S.draft);
}
const itemOf=id=>{ const r=S.draft.list.find(x=>x.id===id); return r?mkItem(id,r.ex):null; };
const partOf=id=>{ const r=S.draft.list.find(x=>x.id===id); return r?r.part:''; };

let ADD=null;
function renderToday(){
  const d=new Date(),el=document.getElementById('v-today');
  document.getElementById('hdate').textContent=`${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  const df=curDraft(), pl=df.place;
  let h=`<div class="pick" style="margin-bottom:10px">${Object.keys(PLACES).map(p=>
    `<button class="${p===pl?'sel':''}" onclick="setPlace('${p}')">${PLACES[p]}</button>`).join('')}</div>`;
  h+=`<div class="tabs" id="tabs">${df.list.map((r,i)=>{
      const e=df.e[r.id], done=e&&e.reps.every(x=>x!=null);
      return `<button class="${i===CUR?'on':''}${done?' ok':''}" onclick="jump(${i})">${done?'✓ ':''}${r.part}</button>`;
    }).join('')}<button class="${CUR===df.list.length?'on':''}" onclick="jump(${df.list.length})">＋</button></div>`;
  h+=`<div class="track" id="track">${df.list.map(r=>card(r)).join('')}${addBox(pl)}</div>`;
  if(df.list.length) h+=`<button class="wide pri" onclick="finish()">この日の記録を保存</button>
      <button class="wide" onclick="discard()">入力を取り消す</button>`;
  el.innerHTML=h;
  const tr=document.getElementById('track');
  if(tr){ tr.onscroll=onTrack; requestAnimationFrame(()=>jump(CUR,true)); }
}
let CUR=0;
function jump(i,now){
  const tr=document.getElementById('track'); if(!tr||!tr.children[i]) return;
  CUR=i; const c=tr.children[i];
  if(tr.scrollTo) tr.scrollTo({left:c.offsetLeft-tr.offsetLeft,behavior:now?'auto':'smooth'});
  else if(c.scrollIntoView) c.scrollIntoView({inline:'start',block:'nearest'});
  mark();
}
function onTrack(){
  const tr=document.getElementById('track'); if(!tr) return;
  let i=0,best=1e9;
  [...tr.children].forEach((c,k)=>{ const d=Math.abs((c.offsetLeft-tr.offsetLeft)-tr.scrollLeft);
    if(d<best){ best=d; i=k; } });
  if(i!==CUR){ CUR=i; mark(); }
}
function mark(){
  const t=document.getElementById('tabs'); if(!t) return;
  [...t.children].forEach((b,i)=>b.classList.toggle('on',i===CUR));
  const c=t.children[CUR]; if(c&&c.scrollIntoView) try{ c.scrollIntoView({inline:'nearest',block:'nearest'}); }catch(x){}
}
function move(id,dir){
  const L=S.draft.list, i=L.findIndex(x=>x.id===id), j=i+dir;
  if(i<0||j<0||j>=L.length) return;
  [L[i],L[j]]=[L[j],L[i]]; save(); CUR=j; renderToday();
}
function addBox(pl){
  if(!ADD) return `<button class="addcard" onclick="ADD={part:null};renderToday()">＋ 種目を追加</button>`;
  if(!ADD.part) return `<div class="card"><div class="row"><h2 style="font-size:15px">部位を選ぶ</h2>
      <button class="xbtn" style="margin-left:auto" onclick="ADD=null;renderToday()">✕</button></div>
      <div class="exlist" style="margin-top:8px">${PARTS.map(p=>{const ld=lastOf(p,pl),
        n=S.draft.list.filter(r=>r.part===p).length;
        return `<button onclick="ADD={part:'${p}'};renderToday()">${p}${n?'（今日'+n+'種目）':''}
          <small>${ld==='0000'?'未実施':'前回 '+ld.slice(5).replace('-','/')}</small></button>`;}).join('')}</div></div>`;
  const used=S.draft.list.map(r=>r.ex);
  return `<div class="card"><div class="row"><h2 style="font-size:15px">${ADD.part}の種目</h2>
    <button class="xbtn" style="margin-left:auto" onclick="ADD={part:null};renderToday()">✕</button></div>
    <div class="exlist" style="margin-top:8px">${libFor(pl,ADD.part).map(x=>{
      const dup=used.includes(x[1]);
      return `<button ${dup?'disabled style="opacity:.4"':`onclick="addEx('${ADD.part}','${x[1]}')"`}>${x[1]}
        <small>${TYPES[x[2]]}${dup?' ／ 追加済み':''}</small></button>`;}).join('')}</div></div>`;
}
function addEx(part,ex){
  S.pick[S.draft.place]=S.pick[S.draft.place]||{}; S.pick[S.draft.place][part]=ex;
  pushItem(S.draft,part,ex); ADD=null; save(); renderToday();
}
function removeItem(id){
  const df=S.draft, e=df.e[id];
  if(e&&e.reps.some(x=>x!=null)&&!confirm('この種目の入力を消します。')) return;
  df.list=df.list.filter(r=>r.id!==id); delete df.e[id]; save(); renderToday();
}
const EXSEL=new Set();
function card(r){
  const it=mkItem(r.id,r.ex), e=S.draft.e[r.id]; if(!e) return '';
  const p=plan(it), hh=hist(r.ex), last=hh[hh.length-1];
  const L=S.draft.list, i=L.findIndex(x=>x.id===r.id);
  let h=`<div class="card" id="c_${r.id}" data-id="${r.id}"><div class="row">
    <h2>${r.part}</h2><span class="chip ${p.cls}">${p.why}</span>
    <span style="margin-left:auto;display:flex;gap:6px">
      <button class="xbtn" ${i<=0?'disabled style="opacity:.3"':`onclick="move('${r.id}',-1)"`}>◀</button>
      <button class="xbtn" ${i>=L.length-1?'disabled style="opacity:.3"':`onclick="move('${r.id}',1)"`}>▶</button>
      <button class="xbtn" onclick="removeItem('${r.id}')">✕</button></span></div>
    <button class="exbtn" onclick="toggleEx('${r.id}')">${r.ex}<span>${EXSEL.has(r.id)?'▴':'▾'}</span></button>`;
  if(EXSEL.has(r.id)){
    const used=L.filter(x=>x.id!==r.id).map(x=>x.ex);
    h+=`<div class="exlist">${libFor(S.draft.place,r.part).map(x=>{const dup=used.includes(x[1]);
      return `<button class="${x[1]===r.ex?'on':''}" ${dup?'disabled style="opacity:.4"':`onclick="setEx('${r.id}','${r.part}','${x[1]}')"`}>${x[1]}
        <small>${TYPES[x[2]]}${dup?' ／ 追加済み':''}</small></button>`;}).join('')}</div>`;
  }
  h+=isBody(it.type)?`<div class="wt"><span class="v num">自重</span></div>`
    :`<div class="wt"><span class="v num" id="w_${r.id}" onclick="editW('${r.id}')">${fmt(e.w)}</span><span class="u">kg</span>
      <span class="stp"><button onclick="wAdj('${r.id}',-${it.step})">−</button><button onclick="wAdj('${r.id}',${it.step})">+</button></span></div>`;
  h+=gear(it,e.w);
  h+=`<p class="prev">${last?`前回 ${isBody(it.type)?'':fmt(last.weight)+'kg × '}${last.reps.join(', ')}`:'記録なし'} ／ 目標 ${it.repMin}–${it.repMax}回 × ${it.sets}</p>`+howTo(r.ex);
  for(let k=0;k<it.sets;k++){
    const done=e.reps[k]!=null, t=e.tmp[k];
    h+=`<div class="set${done?' done':''}"><span class="lb">セット${k+1}</span>`;
    if(done) h+=`<span class="rp num">${e.reps[k]}</span><span class="mut" style="font-size:13px">回</span>
      <button class="go" onclick="undoSet('${r.id}',${k})">取消</button>`;
    else{ const o=[]; for(let n=Math.max(1,t-2);n<=t+3;n++) o.push(n);
      h+=`<div class="reps">${o.map(n=>`<button class="${n===t?'t':''}" onclick="doSet('${r.id}',${k},${n})">${n}</button>`).join('')}</div>`; }
    h+=`</div>`;
  }
  const rest=e.reps.filter(x=>x==null).length;
  if(rest>1) h+=`<button class="wide" style="height:42px;margin-top:8px" onclick="allSet('${r.id}')">残り${rest}セットを ${e.tmp[0]}回 で完了</button>`;
  if(rest===0&&i<L.length-1) h+=`<button class="wide pri" style="height:44px;margin-top:8px" onclick="jump(${i+1})">次の種目へ</button>`;
  return h+`</div>`;
}
function toggleEx(id){ EXSEL.has(id)?EXSEL.delete(id):EXSEL.add(id); refresh(id); }
function setEx(id,part,name){
  const x=LIB.find(y=>y[1]===name); if(!x||x[0]!==part) return;
  EXSEL.delete(id);
  const r=S.draft.list.find(z=>z.id===id); if(!r) return;
  r.ex=name; S.pick[S.draft.place]=S.pick[S.draft.place]||{}; S.pick[S.draft.place][part]=name;
  delete S.draft.e[id]; ensure(S.draft); refresh(id);
}
function refresh(id){
  const el=document.getElementById('c_'+id), r=S.draft.list.find(x=>x.id===id); if(!el||!r) return;
  const d=el.querySelector('details[data-k]'), was=d?d.open:false;
  el.outerHTML=card(r);
  const nd=document.getElementById('c_'+id).querySelector('details[data-k]');
  if(nd) nd.open=was;
  const t=document.getElementById('tabs'), L=S.draft.list, i=L.findIndex(x=>x.id===id);
  if(t&&t.children[i]){ const e=S.draft.e[id], done=e&&e.reps.every(x=>x!=null);
    t.children[i].classList.toggle('ok',done);
    t.children[i].textContent=(done?'✓ ':'')+L[i].part; }
}
function setPlace(p){
  const df=S.draft;
  if(df&&df.e&&Object.values(df.e).some(e=>e.reps.some(x=>x!=null))&&!confirm('入力済みのセットが消えます。')) return;
  S.place=p; S.draft=newDraft(ymd(new Date()),p); ADD=null; CUR=0; save(); renderToday();
}
function editW(id){
  const sp=document.getElementById('w_'+id); if(!sp) return;
  const inp=document.createElement('input');
  inp.type='number'; inp.step='0.5'; inp.inputMode='decimal'; inp.className='winp'; inp.value=S.draft.e[id].w;
  sp.replaceWith(inp); inp.focus(); inp.select();
  let f=false;
  const fin=()=>{ if(f) return; f=true; const v=parseFloat(inp.value);
    if(!isNaN(v)&&v>=0){ S.draft.e[id].w=v; save(); } refresh(id); };
  inp.onblur=fin; inp.onkeydown=ev=>{ if(ev.key==='Enter') inp.blur(); };
}
function wAdj(id,dv){ const it=itemOf(id), e=S.draft.e[id];
  e.w=Math.max(0,Math.round((e.w+dv)*100)/100); save(); refresh(id); }
function doSet(id,i,n){ const e=S.draft.e[id]; e.reps[i]=n; e.tmp[i]=n; save(); refresh(id); startRest(); }
function allSet(id){ const e=S.draft.e[id]; e.reps=e.reps.map((r,i)=>r==null?e.tmp[i]:r); save(); refresh(id); startRest(); }
function undoSet(id,i){ S.draft.e[id].reps[i]=null;  save(); refresh(id); }
function discard(){ if(!confirm('今日の入力を消します。')) return;
  S.draft=null; ADD=null; CUR=0; save(); renderToday(); }
function finish(){
  const df=S.draft; if(!df) return; let n=0;
  df.list.forEach(r=>{ const it=mkItem(r.id,r.ex), e=df.e[r.id]; if(!e) return;
    const reps=e.reps.filter(x=>x!=null); if(!reps.length) return;
    S.logs=S.logs.filter(l=>!(l.date===df.date&&l.ex===r.ex));
    S.logs.push({date:df.date,ex:r.ex,part:r.part,place:df.place,weight:isBody(it.type)?0:e.w,reps}); n++; });
  if(!n) return alert('完了したセットがありません。');
  S.draft=null; ADD=null; CUR=0; save(); stopRest(); renderToday(); alert(n+'種目を保存しました。');
}
let tmr=null,rleft=0;
function startRest(){ clearInterval(tmr); rleft=S.rest; document.getElementById('rest').classList.add('on'); tick();
  tmr=setInterval(()=>{rleft--;tick();if(rleft<=0)stopRest();},1000); }
function tick(){ document.getElementById('rn').textContent=Math.floor(rleft/60)+':'+pad(Math.max(0,rleft%60));
  document.getElementById('rp').style.width=(rleft/S.rest*100)+'%'; }
function stopRest(){ clearInterval(tmr); tmr=null; document.getElementById('rest').classList.remove('on'); }

/* ===== 記録（カレンダー＋推移） ===== */
let cy,cm,csel=null,pex=null;
function renderLog(){
  const t=new Date(); if(cy===undefined){cy=t.getFullYear();cm=t.getMonth();}
  const start=new Date(cy,cm,1).getDay(), days=new Date(cy,cm+1,0).getDate();
  let h=`<div class="mnav"><button onclick="mv(-1)">‹</button><span class="m num">${cy}年${cm+1}月</span><button onclick="mv(1)" style="margin-left:auto">›</button></div><div class="cal">`;
  WD.forEach(w=>h+=`<div class="hd">${w}</div>`);
  for(let i=0;i<start;i++) h+=`<button class="out"></button>`;
  for(let d=1;d<=days;d++){
    const k=`${cy}-${pad(cm+1)}-${pad(d)}`, lg=S.logs.filter(l=>l.date===k);
    h+=`<button class="${lg.length?lg[0].place:''}${csel===k?' sel':''}" onclick="csel='${k}';renderLog()">
      <span class="num">${d}</span><span class="tag">${lg.length?[...new Set(lg.map(l=>l.part[0]))].join(''):''}</span></button>`;
  }
  h+=`</div>`;
  if(csel){
    const lg=S.logs.filter(l=>l.date===csel);
    h+=`<div class="card" style="margin-top:14px"><div class="row"><h2 style="font-size:15px">${csel.slice(5).replace('-','/')}</h2>
      ${lg.length?`<span class="chip ${lg[0].place}">${PLACES[lg[0].place]}</span>
      <span class="mut" style="font-size:12.5px">${[...new Set(lg.map(l=>l.part))].join(' / ')}</span>`:''}</div>`;
    h+=lg.length?lg.map(l=>`<div class="set"><span style="flex:1">${l.part}・${l.ex}<br><span class="mut" style="font-size:13px">${l.weight?fmt(l.weight)+'kg × ':''}${l.reps.join(', ')}</span></span>
      <button class="del" onclick="delLog('${l.date}','${l.ex}')">削除</button></div>`).join('')
      :`<p class="mut" style="font-size:13px;margin:6px 0 0">記録なし</p>`;
    h+=`</div>`;
  }
  const list=[...new Set(S.logs.map(l=>l.ex))];
  if(list.length){
    if(!pex||!list.includes(pex)) pex=list[0];
    h+=`<div class="card"><h2 style="font-size:15px;margin-bottom:8px">推移</h2>
      <select class="sel2" onchange="pex=this.value;renderLog()">${list.map(x=>`<option${x===pex?' selected':''}>${x}</option>`).join('')}</select>`;
    const hh=hist(pex), body=hh.length&&hh[0].weight===0;
    if(hh.length<2) h+=`<p class="mut" style="font-size:13px;margin:10px 0 0">記録が2回たまるとグラフが出ます。</p>`;
    else{
      const vs=hh.map(l=>body?vol(l):e1rm(l)), mn=Math.min(...vs), mx=Math.max(...vs);
      const u=body?1:2.5, lo=Math.floor((mn-u)/u)*u, hi=Math.ceil((mx+u)/u)*u;
      const W=320,H=160,L=34,R=10,T=12,B=24;
      const X=i=>L+(W-L-R)*(vs.length===1?0:i/(vs.length-1)), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo||1));
      const dp=vs.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
      let g=''; for(let i=0;i<=2;i++){const v=lo+(hi-lo)*i/2;
        g+=`<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${v.toFixed(0)}</text>`;}
      h+=`<div class="chart" style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}">${g}
        <path d="${dp} L${X(vs.length-1).toFixed(1)} ${H-B} L${X(0).toFixed(1)} ${H-B} Z" fill="rgba(255,184,28,.12)"/>
        <path d="${dp}" fill="none" stroke="var(--acc)" stroke-width="2"/>
        ${vs.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="var(--acc)"/>`).join('')}</svg></div>
        <div class="stat"><div><div class="k">${body?'総レップ数':'推定1RM'}</div><div class="v num">${vs[vs.length-1].toFixed(body?0:1)}</div></div>
        <div><div class="k">最高</div><div class="v num">${mx.toFixed(body?0:1)}</div></div>
        <div><div class="k">初回比</div><div class="v num">${(vs[vs.length-1]-vs[0]>=0?'+':'')+(vs[vs.length-1]-vs[0]).toFixed(body?0:1)}</div></div></div>`;
    }
    h+=`</div>`;
  }
  document.getElementById('v-log').innerHTML=h;
}
function mv(d){ cm+=d; if(cm<0){cm=11;cy--} if(cm>11){cm=0;cy++} renderLog(); }
function delLog(d,ex){ if(!confirm(ex+' の記録を削除します。')) return;
  S.logs=S.logs.filter(l=>!(l.date===d&&l.ex===ex)); save(); renderLog(); }

const CC=()=>window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorCalendar;
function doneText(k){ const lg=S.logs.filter(l=>l.date===k); if(!lg.length) return '';
  return PLACES[lg[0].place]+'\n'+lg.map(l=>'  '+l.part+'：'+l.ex+'  '+(l.weight?fmt(l.weight)+'kg × ':'')+l.reps.join(', ')).join('\n'); }
function buildEvents(){
  const [sh,sm]=S.start.split(':').map(Number), t=new Date();
  const days=[...new Set(S.logs.map(l=>l.date))].sort(), ev=[];
  const lim=new Date(t); lim.setDate(lim.getDate()-S.back);
  days.filter(k=>parse(k)>=lim).forEach(k=>{
    const d=parse(k), st=new Date(d.getFullYear(),d.getMonth(),d.getDate(),sh,sm).getTime();
    ev.push({key:k,title:'🏋 筋トレ',start:st,end:st+S.dur*60000,
      desc:doneText(k)+'\n---\n#gymlog:'+k.replace(/-/g,'')});
  });
  return ev;
}
async function pickCal(){
  const P=CC(); if(!P) return alert('端末カレンダー経由はAPK版でのみ使えます。');
  try{
    const g=await P.requestFullCalendarAccess();
    if(g&&g.result!=='granted') return alert('アクセスが許可されませんでした。');
    const r=await P.listCalendars(), all=(r&&(r.result||r.calendars))||r||[];
    const ws=all.filter(c=>c&&c.id);
    if(!ws.length) return alert('書き込めるカレンダーがありません。');
    const n=prompt('番号を入力してください。Googleアカウント名の付いたものを選ぶとGoogleカレンダーに同期されます。\n\n'
      +ws.map((c,i)=>`${i+1}. ${c.title||c.internalTitle||'(無題)'}${c.accountName?' / '+c.accountName:''}`).join('\n'));
    const i=parseInt(n,10)-1; if(!(i>=0&&i<ws.length)) return;
    S.sync.calId=ws[i].id; S.sync.calName=(ws[i].title||ws[i].internalTitle||'')+(ws[i].accountName?' / '+ws[i].accountName:'');
    save(); renderSet();
  }catch(e){ alert('取得に失敗しました。\n'+(e&&e.message||e)); }
}
async function put(k,title,desc,st,en){
  const P=CC(), id=S.sync.ids[k];
  if(id){ try{ await P.modifyEvent({id,title,description:desc,startDate:st,endDate:en}); return 'u'; }catch(e){ delete S.sync.ids[k]; } }
  const r=await P.createEvent({title,description:desc,startDate:st,endDate:en,calendarId:S.sync.calId});
  if(r&&r.id) S.sync.ids[k]=r.id; return 'c';
}
async function syncCal(){
  const ev=buildEvents(); if(!ev.length) return alert('同期できる記録がありません。');
  if(S.sync.mode==='script'){
    if(!S.sync.url) return alert('デプロイURLを入力してください。');
    try{ const r=await fetch(S.sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({token:S.sync.token,events:ev})});
      const j=await r.json();
      return alert(j.ok?`新規 ${j.created}件 ／ 更新 ${j.updated}件`:'拒否されました：'+(j.error||'不明'));
    }catch(e){ return alert('送信に失敗しました。URLとアクセス権を確認してください。'); }
  }
  const P=CC(); if(!P) return alert('端末カレンダー経由はAPK版でのみ使えます。');
  if(!S.sync.calId) return alert('先に書き込み先を選んでください。');
  const g=await P.requestFullCalendarAccess(); if(g&&g.result!=='granted') return alert('許可されませんでした。');
  let c=0,u=0,er=0;
  for(const e of ev){ try{ (await put(e.key,e.title,e.desc,e.start,e.end))==='c'?c++:u++; }catch(x){ er++; } }
  save(); alert(`新規 ${c}件 ／ 更新 ${u}件${er?' ／ 失敗 '+er+'件':''}`);
}

/* ===== 切替 ===== */
const TT={today:'今日',log:'記録',set:'設定'};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  const v=b.dataset.v;
  document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.getElementById('ttl').textContent=TT[v];
  spage=null;({today:renderToday,log:renderLog,set:renderSet})[v]();
  window.scrollTo(0,0);
});
renderToday();
