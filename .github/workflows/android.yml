name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22          # @capacitor/cli 8.x は Node >=22 が必須

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21          # AGP 8.13 / compileSdk 36 に対応

      # ランナーに入っている SDK をそのまま使う。
      # 不足パッケージがあれば入れるが、失敗してもGradleが自動取得するため止めない。
      - name: Ensure Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json www/

      - name: Install
        run: |
          npm init -y
          npm i @capacitor/core@8 @capacitor/android@8 @ebarooni/capacitor-calendar@8
          npm i -D @capacitor/cli@8

      - name: Capacitor init
        run: |
          npx cap init "Barload" "com.cannedcountry.workout" --web-dir=www
          npx cap add android

      - name: Add calendar permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -c CALENDAR android/app/src/main/AndroidManifest.xml

      - name: Sync
        run: npx cap sync android

      - name: Build
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: barload-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
